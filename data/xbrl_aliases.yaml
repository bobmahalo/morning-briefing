  Cost_of_Revenue:
    statement: income
    period_type: duration
    tags:
    - us-gaap:CostOfRevenue
    - us-gaap:CostOfGoodsAndServicesSold
    unit: USD
    definition_tag: us-gaap:CostOfRevenue
    definition: The aggregate cost of goods produced and sold and services rendered during the reporting period.
    label: Cost of Revenue
    conditional_aliases: {}
    equivalent_aliases:
      us-gaap:CostOfGoodsAndServicesSold: Both definitions describe aggregate goods produced/sold and services rendered
        costs. This field is goods/services cost of revenue, not financing costs or goods-only cost. Confirmed in
        Nike consolidated cost-of-sales rows.
  Gross_Profit:
    statement: income
    period_type: duration
    tags:
    - us-gaap:GrossProfit
    unit: USD
    definition_tag: us-gaap:GrossProfit
    definition: Aggregate revenue less cost of goods and services sold or operating expenses directly attributable
      to the revenue generation activity.
    label: Gross Profit
  Research_and_Development:
    statement: income
    period_type: duration
    tags:
    - us-gaap:ResearchAndDevelopmentExpense
    unit: USD
    definition_tag: us-gaap:ResearchAndDevelopmentExpense
    definition: The aggregate costs incurred (1) in a planned search or critical investigation aimed at discovery
      of new knowledge with the hope that such knowledge will be useful in developing a new product or service,
      a new process or technique, or in bringing about a significant improvement to an existing product or process;
      or (2) to translate research findings or other knowledge into a plan or design for a new product or process
      or for a significant improvement to an existing product or process whether intended for sale or the entity's
      use, during the reporting period charged to research and development projects, including the costs of developing
      computer software up to the point in time of achieving technological feasibility, and costs allocated in accounting
      for a business combination to in-process projects deemed to have no alternative future use.
    label: Research and Development Expense
  Selling_General_and_Admin:
    statement: income
    period_type: duration
    tags:
    - us-gaap:SellingGeneralAndAdministrativeExpense
    unit: USD
    definition_tag: us-gaap:SellingGeneralAndAdministrativeExpense
    definition: The aggregate total costs related to selling a firm's product and services, as well as all other
      general and administrative expenses. Direct selling expenses (for example, credit, warranty, and advertising)
      are expenses that can be directly linked to the sale of specific products. Indirect selling expenses are expenses
      that cannot be directly linked to the sale of specific products, for example telephone expenses, Internet,
      and postal charges. General and administrative expenses include salaries of non-sales personnel, rent, utilities,
      communication, etc.
    label: Selling, General and Administrative Expense
  Operating_Expenses:
    statement: income
    period_type: duration
    tags:
    - us-gaap:OperatingExpenses
    unit: USD
    definition_tag: us-gaap:OperatingExpenses
    definition: Generally recurring costs associated with normal operations except for the portion of these expenses
      which can be clearly related to production and included in cost of sales or services. Includes selling, general
      and administrative expense.
    label: Operating Expenses
  Operating_Income:
    statement: income
    period_type: duration
    tags:
    - us-gaap:OperatingIncomeLoss
    unit: USD
    definition_tag: us-gaap:OperatingIncomeLoss
    definition: The net result for the period of deducting operating expenses from operating revenues.
    label: Operating Income (Loss)
  Interest_Expense:
    statement: income
    period_type: duration
    tags:
    - us-gaap:InterestExpense
    - us-gaap:InterestExpenseNonoperating
    unit: USD
    definition_tag: us-gaap:InterestExpense
    definition: Amount of the cost of borrowed funds accounted for as interest expense.
    label: Interest Expense
