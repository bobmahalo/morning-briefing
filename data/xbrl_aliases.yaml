  Pre_Tax_Income:
    statement: income
    period_type: duration
    tags:
    - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
    unit: USD
    definition_tag: us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
    definition: Amount of income (loss) from continuing operations, including income (loss) from equity method investments,
      before deduction of income tax expense (benefit), and income (loss) attributable to noncontrolling interest.
    label: Income (Loss) from Continuing Operations before Income Taxes, Noncontrolling Interest
  Income_Tax_Expense:
    statement: income
    period_type: duration
    tags:
    - us-gaap:IncomeTaxExpenseBenefit
    unit: USD
    definition_tag: us-gaap:IncomeTaxExpenseBenefit
    definition: Amount of current income tax expense (benefit) and deferred income tax expense (benefit) pertaining
      to continuing operations.
    label: Income Tax Expense (Benefit)
  Net_Income:
    statement: income
    period_type: duration
    tags:
    - us-gaap:NetIncomeLoss
    unit: USD
    definition_tag: us-gaap:NetIncomeLoss
    definition: The portion of profit or loss for the period, net of income taxes, which is attributable to the
      parent.
    label: Net Income (Loss) Attributable to Parent
  Cash_and_Equivalents:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:CashAndCashEquivalentsAtCarryingValue
    unit: USD
    definition_tag: us-gaap:CashAndCashEquivalentsAtCarryingValue
    definition: Amount of currency on hand as well as demand deposits with banks or financial institutions. Includes
      other kinds of accounts that have the general characteristics of demand deposits. Also includes short-term,
      highly liquid investments that are both readily convertible to known amounts of cash and so near their maturity
      that they present insignificant risk of changes in value because of changes in interest rates. Excludes cash
      and cash equivalents within disposal group and discontinued operation.
    label: Cash and Cash Equivalents, at Carrying Value
  Short_Term_Investments:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:ShortTermInvestments
    unit: USD
    definition_tag: us-gaap:ShortTermInvestments
    definition: Amount of investments including trading securities, available-for-sale securities, held-to-maturity
      securities, and short-term investments classified as other and current.
    label: Short-term Investments
  Accounts_Receivable:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:AccountsReceivableNetCurrent
    - us-gaap:ContractWithCustomerReceivableAfterAllowanceForCreditLossCurrent
    unit: USD
    definition_tag: us-gaap:AccountsReceivableNetCurrent
    definition: Amount, after allowance for credit loss, of right to consideration from customer for product sold
      and service rendered in normal course of business, classified as current.
    label: Accounts Receivable, after Allowance for Credit Loss, Current
    equivalent_aliases:
      us-gaap:ContractWithCustomerReceivableAfterAllowanceForCreditLossCurrent: Both definitions describe current
        customer trade consideration for delivered goods/services after the credit-loss allowance; neither is a
        broader other-receivables total or a conditional contract asset.
  Inventory:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:InventoryNet
    unit: USD
    definition_tag: us-gaap:InventoryNet
    definition: Amount after valuation and LIFO reserves of inventory expected to be sold, or consumed within one
      year or operating cycle, if longer.
    label: Inventory, Net
  Total_Current_Assets:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:AssetsCurrent
    unit: USD
    definition_tag: us-gaap:AssetsCurrent
    definition: Sum of the carrying amounts as of the balance sheet date of all assets that are expected to be realized
      in cash, sold, or consumed within one year (or the normal operating cycle, if longer). Assets are probable
      future economic benefits obtained or controlled by an entity as a result of past transactions or events.
    label: Assets, Current
  Property_Plant_and_Equipment_Net:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:PropertyPlantAndEquipmentNet
    unit: USD
    definition_tag: us-gaap:PropertyPlantAndEquipmentNet
    definition: Amount after accumulated depreciation, depletion and amortization of physical assets used in the
      normal conduct of business to produce goods and services and not intended for resale. Examples include, but
      are not limited to, land, buildings, machinery and equipment, office equipment, and furniture and fixtures.
    label: Property, Plant and Equipment, Net
  Goodwill:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:Goodwill
    unit: USD
    definition_tag: us-gaap:Goodwill
    definition: Amount after accumulated impairment loss of an asset representing future economic benefits arising
      from other assets acquired in a business combination that are not individually identified and separately recognized.
    label: Goodwill
  Intangible_Assets_Ex_Goodwill:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:IntangibleAssetsNetExcludingGoodwill
    unit: USD
    definition_tag: us-gaap:IntangibleAssetsNetExcludingGoodwill
    definition: Sum of the carrying amounts of all intangible assets, excluding goodwill, as of the balance sheet
      date, net of accumulated amortization and impairment charges.
    label: Intangible Assets, Net (Excluding Goodwill)
  Total_Assets:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:Assets
    unit: USD
    definition_tag: us-gaap:Assets
    definition: Sum of the carrying amounts as of the balance sheet date of all assets that are recognized. Assets
      are probable future economic benefits obtained or controlled by an entity as a result of past transactions
      or events.
    label: Assets
  Accounts_Payable:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:AccountsPayableCurrent
    unit: USD
    definition_tag: us-gaap:AccountsPayableCurrent
    definition: Carrying value as of the balance sheet date of liabilities incurred (and for which invoices have
      typically been received) and payable to vendors for goods and services received that are used in an entity's
      business. Used to reflect the current portion of the liabilities (due within one year or within the normal
      operating cycle if longer).
    label: Accounts Payable, Current
  Deferred_Revenue:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:ContractWithCustomerLiabilityCurrent
    unit: USD
    definition_tag: us-gaap:ContractWithCustomerLiabilityCurrent
    definition: Amount of obligation to transfer good or service to customer for which consideration has been received
      or is receivable, classified as current.
    label: Contract with Customer, Liability, Current
  Short_Term_Debt:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:DebtCurrent
    unit: USD
    definition_tag: us-gaap:DebtCurrent
    definition: Amount of short-term debt and current maturity of long-term debt and capital lease obligations due
      within one year or the normal operating cycle, if longer.
    label: Debt, Current
  Operating_Lease_Liability_Current:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:OperatingLeaseLiabilityCurrent
    unit: USD
    definition_tag: us-gaap:OperatingLeaseLiabilityCurrent
    definition: Present value of lessee's discounted obligation for lease payments from operating lease, classified
      as current.
    label: Operating Lease, Liability, Current
  Total_Current_Liabilities:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:LiabilitiesCurrent
    unit: USD
    definition_tag: us-gaap:LiabilitiesCurrent
    definition: Total obligations incurred as part of normal operations that are expected to be paid during the
      following twelve months or within one business cycle, if longer.
    label: Liabilities, Current
  Long_Term_Debt:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:LongTermDebtNoncurrent
    unit: USD
    definition_tag: us-gaap:LongTermDebtNoncurrent
    definition: Amount after unamortized (discount) premium and debt issuance costs of long-term debt classified
      as noncurrent and excluding amounts to be repaid within one year or the normal operating cycle, if longer.
      Includes, but not limited to, notes payable, bonds payable, debentures, mortgage loans and commercial paper.
      Excludes capital lease obligations.
    label: Long-term Debt, Excluding Current Maturities
  Operating_Lease_Liability_Noncurrent:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:OperatingLeaseLiabilityNoncurrent
    unit: USD
    definition_tag: us-gaap:OperatingLeaseLiabilityNoncurrent
    definition: Present value of lessee's discounted obligation for lease payments from operating lease, classified
      as noncurrent.
    label: Operating Lease, Liability, Noncurrent
  Convertible_Debt:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:ConvertibleDebtNoncurrent
    unit: USD
    definition_tag: us-gaap:ConvertibleDebtNoncurrent
    definition: Carrying amount of long-term convertible debt as of the balance sheet date, net of the amount due
      in the next twelve months or greater than the normal operating cycle, if longer. The debt is convertible into
      another form of financial instrument, typically the entity's common stock.
    label: Convertible Debt, Noncurrent
  Total_Liabilities:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:Liabilities
    unit: USD
    definition_tag: us-gaap:Liabilities
    definition: Sum of the carrying amounts as of the balance sheet date of all liabilities that are recognized.
      Liabilities are probable future sacrifices of economic benefits arising from present obligations of an entity
      to transfer assets or provide services to other entities in the future.
    label: Liabilities
  Retained_Earnings:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:RetainedEarningsAccumulatedDeficit
    unit: USD
    definition_tag: us-gaap:RetainedEarningsAccumulatedDeficit
    definition: The cumulative amount of the reporting entity's undistributed earnings or deficit.
    label: Retained Earnings (Accumulated Deficit)
  Total_Equity:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:StockholdersEquity
    unit: USD
    definition_tag: us-gaap:StockholdersEquity
    definition: Total of all stockholders' equity (deficit) items, net of receivables from officers, directors,
      owners, and affiliates of the entity which are attributable to the parent. The amount of the economic entity's
      stockholders' equity attributable to the parent excludes the amount of stockholders' equity which is allocable
      to that ownership interest in subsidiary equity which is not attributable to the parent (noncontrolling interest,
      minority interest). This excludes temporary equity and is sometimes called permanent equity.
    label: Stockholders' Equity Attributable to Parent
  Total_Liabilities_and_Equity:
    statement: balance
    period_type: instant
    tags:
    - us-gaap:LiabilitiesAndStockholdersEquity
    unit: USD
    definition_tag: us-gaap:LiabilitiesAndStockholdersEquity
    definition: Amount of liabilities and equity items, including the portion of equity attributable to noncontrolling
      interests, if any.
    label: Liabilities and Equity
  Cover_Page_Shares_Outstanding:
    statement: shares
    period_type: instant
    tags:
    - dei:EntityCommonStockSharesOutstanding
    unit: shares
    definition_tag: dei:EntityCommonStockSharesOutstanding
    definition: Indicate number of shares or other units outstanding of each of registrant's classes of capital
      or common stock or other ownership interests, if and as stated on cover of related periodic report. Where
      multiple classes or units exist define each class/interest by adding class of stock items such as Common Class
      A [Member], Common Class B [Member] or Partnership Interest [Member] onto the Instrument [Domain] of the Entity
      Listings, Instrument.
    label: Entity Common Stock, Shares Outstanding
  Diluted_Shares_Outstanding:
    statement: shares
    period_type: duration
    tags:
    - us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
    unit: shares
    definition_tag: us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
    definition: The average number of shares or units issued and outstanding that are used in calculating diluted
      EPS or earnings per unit (EPU), determined based on the timing of issuance of shares or units in the period.
    label: Weighted Average Number of Shares Outstanding, Diluted
  Operating_Cash_Flow:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:NetCashProvidedByUsedInOperatingActivities
    unit: USD
    definition_tag: us-gaap:NetCashProvidedByUsedInOperatingActivities
    definition: Amount of cash inflow (outflow) from operating activities, including discontinued operations. Operating
      activity cash flows include transactions, adjustments, and changes in value not defined as investing or financing
      activities.
    label: Net Cash Provided by (Used in) Operating Activities
  Depreciation_and_Amortization:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:DepreciationDepletionAndAmortization
    unit: USD
    definition_tag: us-gaap:DepreciationDepletionAndAmortization
    definition: The aggregate expense recognized in the current period that allocates the cost of tangible assets,
      intangible assets, or depleting assets to periods that benefit from use of the assets.
    label: Depreciation, Depletion and Amortization
  Stock_Based_Compensation:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:ShareBasedCompensation
    unit: USD
    definition_tag: us-gaap:ShareBasedCompensation
    definition: Amount of noncash expense for share-based payment arrangement.
    label: Share-based Payment Arrangement, Noncash Expense
  Capital_Expenditures:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
    unit: USD
    definition_tag: us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
    definition: The cash outflow associated with the acquisition of long-lived, physical assets that are used in
      the normal conduct of business to produce goods and services and not intended for resale; includes cash outflows
      to pay for construction of self-constructed assets.
    label: Payments to Acquire Property, Plant, and Equipment
  Free_Cash_Flow:
    statement: cashflow
    period_type: duration
    tags: []
    derived:
      formula: Operating_Cash_Flow - Capital_Expenditures
      inputs:
      - Operating_Cash_Flow
      - Capital_Expenditures
    unit: USD
    definition_tag: us-gaap:FreeCashFlow
    definition: Operating cash flow less payments to acquire PP&E; project-defined measure.
    label: Free_Cash_Flow
  Cash_Acquisitions:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:PaymentsToAcquireBusinessesNetOfCashAcquired
    unit: USD
    definition_tag: us-gaap:PaymentsToAcquireBusinessesNetOfCashAcquired
    definition: The cash outflow associated with the acquisition of a business, net of the cash acquired from the
      purchase.
    label: Payments to Acquire Businesses, Net of Cash Acquired
  Debt_Issued:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:ProceedsFromIssuanceOfLongTermDebt
    unit: USD
    definition_tag: us-gaap:ProceedsFromIssuanceOfLongTermDebt
    definition: The cash inflow from a debt initially having maturity due after one year or beyond the operating
      cycle, if longer.
    label: Proceeds from Issuance of Long-term Debt
  Debt_Repaid:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:RepaymentsOfLongTermDebt
    unit: USD
    definition_tag: us-gaap:RepaymentsOfLongTermDebt
    definition: The cash outflow for debt initially having maturity due after one year or beyond the normal operating
      cycle, if longer.
    label: Repayments of Long-term Debt
  Stock_Issued:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:ProceedsFromIssuanceOfCommonStock
    unit: USD
    definition_tag: us-gaap:ProceedsFromIssuanceOfCommonStock
    definition: The cash inflow from the additional capital contribution to the entity.
    label: Proceeds from Issuance of Common Stock
  Stock_Buybacks:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:PaymentsForRepurchaseOfCommonStock
    unit: USD
    definition_tag: us-gaap:PaymentsForRepurchaseOfCommonStock
    definition: The cash outflow to reacquire common stock during the period.
    label: Payments for Repurchase of Common Stock
  Dividends_Paid:
    statement: cashflow
    period_type: duration
    tags:
    - us-gaap:PaymentsOfDividendsCommonStock
    unit: USD
    definition_tag: us-gaap:PaymentsOfDividendsCommonStock
    definition: Amount of cash outflow in the form of ordinary dividends to common shareholders of the parent entity.
    label: Payments of Ordinary Dividends, Common Stock
