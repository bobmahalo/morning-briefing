<style>
details {
  margin: 10px 0 16px 0;
  padding: 10px 14px;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  background-color: #f6f8fa;
}
details > summary {
  cursor: pointer;
  outline: none;
}
details[open] > summary {
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #d0d7de;
}
details table {
  background-color: #ffffff;
}
</style>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  startup: {
    ready: () => {
      const currencyRe = /(?<!\\)\$(?=[-+]?\d[\d,]*(?:\.\d+)?(?:[MBKTmbkt]\b|\/sh\b|\*)?(?!\s*(?:[\\%^_+\-=<>×÷]|\\times|\\le|\\ge|\\text|\$|[–-]\d)))/g;
      const skipTags = new Set(['SCRIPT', 'NOSCRIPT', 'STYLE', 'TEXTAREA', 'PRE', 'CODE']);
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) {
        if (!n.parentElement || !skipTags.has(n.parentElement.tagName)) {
          if (n.nodeValue && n.nodeValue.includes('$')) {
            nodes.push(n);
          }
        }
      }
      for (const textNode of nodes) {
        textNode.nodeValue = textNode.nodeValue.replace(currencyRe, '\\$');
      }
      MathJax.startup.defaultReady();
    }
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
